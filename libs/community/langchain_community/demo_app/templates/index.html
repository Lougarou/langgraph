<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurrentDB Checkpointer (MemorySaver) Demo</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
    <style>
        body { display: flex; }
        #graph-container { width: 70%; height: 100vh; background: #f0f0f0; }
        #log-container { width: 30%; padding: 10px; overflow-y: auto; }
        .node { fill: steelblue; r: 35px; }
        .highlighted { fill: orange; }
        .link { stroke: #999; stroke-width: 2px; marker-end: url(#arrow); }
        .highlighted-link { stroke: red; stroke-width: 3px; animation: moveArrow 1s linear infinite; }
        .node-label { font-size: 14px; fill: black; }
        @keyframes moveArrow {
            0% { stroke-dasharray: 5, 5; stroke-dashoffset: 10; }
            100% { stroke-dasharray: 5, 5; stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <div id="graph-container"></div>
    <div id="log-container"></div>

    <script>
        const nodes = {{ nodes | tojson }};
        const edges = {{ edges | tojson }};
        const width = document.getElementById('graph-container').clientWidth;
        const height = document.getElementById('graph-container').clientHeight;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 40)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .style("fill", "#999");

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(edges).id(d => d.id).distance(200))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("charge", d3.forceManyBody().strength(-100));

        const link = svg.selectAll(".link")
            .data(edges)
            .enter().append("line")
            .attr("class", "link")
            .attr("marker-end", "url(#arrow)");

        const node = svg.selectAll(".node")
            .data(nodes)
            .enter().append("circle")
            .attr("class", "node")
            .attr("r", 35)
            .call(drag(simulation));

        const labels = svg.selectAll(".node-label")
            .data(nodes)
            .enter().append("text")
            .attr("class", "node-label")
            .attr("text-anchor", "start")
            .attr("dx", 40)
            .attr("dy", 5)
            .text(d => d.id);

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node.attr("cx", d => d.x)
                .attr("cy", d => d.y);

            labels.attr("x", d => d.x + 40)
                .attr("y", d => d.y + 5);
        });

        const socket = io();
        socket.on('update_graph', data => {
            node.classed("highlighted", d => data.nodes.includes(d.id));
            link.classed("highlighted-link", d => data.nodes.includes(d.source.id) || data.nodes.includes(d.target.id));
            document.getElementById("log-container").innerHTML += `<p>${data.message}</p>`;
        });

        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }
    </script>
</body>
</html>
